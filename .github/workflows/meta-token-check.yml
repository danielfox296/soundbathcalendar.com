# Manual, read-only health check on the Meta Page token (CAL-25).
#
# The registry carried "Page token assumed non-expiring" for months. Assumed.
# scripts/meta_check.py exists precisely to settle that: a long-lived USER
# token dies after 60 days and looks identical to a PAGE token when you copy
# it out of the Graph Explorer, so the carousel would stop on a Tuesday with
# no error until the deploy went red.
#
# The token cannot be read back out of Actions secrets, so the only place this
# question can be answered is inside a run that already has it. The script
# never prints the token — its output is explicitly safe to share — and this
# publishes nothing.
name: Check the Meta token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report on the token
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          if [ -z "$META_PAGE_TOKEN" ]; then
            echo "META_PAGE_TOKEN is unset — nothing to check."
            exit 1
          fi
          python3 scripts/meta_check.py
