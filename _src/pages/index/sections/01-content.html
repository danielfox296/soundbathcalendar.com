<!-- CALENDAR_TICKER: the full-bleed coral broadcast ticker (CAL-28) —
     tonight's real sessions, pure CSS, aria-hidden. Sits above the padded
     section so it spans the viewport. -->
<!-- CALENDAR_TICKER -->
<section class="section section--light cal-main">
  <div class="container">
    <!-- The identity block (v5 Broadcast): left-set monument H1 over the
         machine-extractable summary, stamp beneath (comp order). -->
    <div class="cal-hero">
      <h1 class="cal-h1">Sound baths in Denver &amp; the Front&nbsp;Range</h1>

      <p class="cal-summary" id="cal-summary"><!-- CALENDAR_SUMMARY --></p>

      <p class="cal-updated">Last updated <!-- CALENDAR_LAST_UPDATED -->.</p>
    </div>

    <!-- CALENDAR_BODY -->

    <!-- DIGEST_BLOCK: filled at build time by external_events.render_digest_block
         (the signup + this week's live email preview, CAL-18). -->
    <!-- DIGEST_BLOCK -->

    <p class="cal-submit">Running sessions, or have a space that could host one?
    <a href="{{css_path}}submit/">Add to the calendar.</a></p>
  </div>
</section>
